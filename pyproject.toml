[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pysound"]

# [[tool.mypy.overrides]]
# module = ["anytree", "anytree.*"]
# follow_untyped_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ['RUF009']

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
